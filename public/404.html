<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this for unknown paths (there is no real /callback
      // file). Bounce to the app root, preserving the OAuth ?code=/&state= query
      // so the PKCE callback can complete. Keep in sync with the repo path below.
      (function () {
        var base = "/swipe-likes/";
        var l = window.location;
        l.replace(l.origin + base + l.search + l.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
